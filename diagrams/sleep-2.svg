<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Opportunity lifecycle</title><desc id="desc">Risk approval reserves budget. A rejection stops that candidate. A closed paper position releases its reservation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#aac2cd"/></marker></defs><rect width="640" height="420" rx="15" fill="#14222b"/><text x="20" y="34" fill="#bdef91" font-size="22" font-weight="700">Opportunity lifecycle</text><rect x="225" y="54" width="190" height="38" rx="7" fill="#203240" stroke="#7795a6"/><text x="320.0" y="78" text-anchor="middle" fill="#e5eef0" font-size="17">Candidate discovered</text><path d="M320 93L320 122" stroke="#aac2cd" stroke-width="2" marker-end="url(#arrow)"/><text x="320.0" y="99.5" text-anchor="middle" fill="#e5eef0" font-size="15"></text><rect x="225" y="125" width="190" height="38" rx="7" fill="#203240" stroke="#7795a6"/><text x="320.0" y="149" text-anchor="middle" fill="#e5eef0" font-size="17">Risk decision</text><path d="M270 164L145 217" stroke="#aac2cd" stroke-width="2" marker-end="url(#arrow)"/><text x="207.5" y="182.5" text-anchor="middle" fill="#e5eef0" font-size="15"></text><path d="M370 164L495 217" stroke="#aac2cd" stroke-width="2" marker-end="url(#arrow)"/><text x="432.5" y="182.5" text-anchor="middle" fill="#e5eef0" font-size="15"></text><rect x="40" y="220" width="210" height="38" rx="7" fill="#203240" stroke="#7795a6"/><text x="145.0" y="244" text-anchor="middle" fill="#e5eef0" font-size="17">Rejected</text><rect x="390" y="220" width="210" height="38" rx="7" fill="#203240" stroke="#7795a6"/><text x="495.0" y="244" text-anchor="middle" fill="#e5eef0" font-size="17">Reserved</text><path d="M495 259L495 286" stroke="#aac2cd" stroke-width="2" marker-end="url(#arrow)"/><text x="495.0" y="264.5" text-anchor="middle" fill="#e5eef0" font-size="15"></text><rect x="390" y="289" width="210" height="38" rx="7" fill="#203240" stroke="#7795a6"/><text x="495.0" y="313" text-anchor="middle" fill="#e5eef0" font-size="17">Paper position managed</text><path d="M495 328L495 355" stroke="#aac2cd" stroke-width="2" marker-end="url(#arrow)"/><text x="495.0" y="333.5" text-anchor="middle" fill="#e5eef0" font-size="15"></text><rect x="390" y="358" width="210" height="38" rx="7" fill="#203240" stroke="#7795a6"/><text x="495.0" y="382" text-anchor="middle" fill="#e5eef0" font-size="17">Closed → release</text></svg>
