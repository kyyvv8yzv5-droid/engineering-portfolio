<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Evidence review states</title><desc id="desc">Prepared evidence enters pending review. Explicit confirmation or discard are distinct transitions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#aac2cd"/></marker></defs><rect width="640" height="285" rx="15" fill="#14222b"/><text x="20" y="34" fill="#bdef91" font-size="22" font-weight="700">Evidence review states</text><rect x="225" y="54" width="190" height="38" rx="7" fill="#203240" stroke="#7795a6"/><text x="320.0" y="78" text-anchor="middle" fill="#e5eef0" font-size="17">Prepared evidence</text><path d="M320 93L320 122" stroke="#aac2cd" stroke-width="2" marker-end="url(#arrow)"/><text x="320.0" y="99.5" text-anchor="middle" fill="#e5eef0" font-size="15"></text><rect x="225" y="125" width="190" height="38" rx="7" fill="#203240" stroke="#7795a6"/><text x="320.0" y="149" text-anchor="middle" fill="#e5eef0" font-size="17">Pending review</text><path d="M270 164L155 217" stroke="#aac2cd" stroke-width="2" marker-end="url(#arrow)"/><text x="212.5" y="182.5" text-anchor="middle" fill="#e5eef0" font-size="15"></text><path d="M370 164L480 217" stroke="#aac2cd" stroke-width="2" marker-end="url(#arrow)"/><text x="425.0" y="182.5" text-anchor="middle" fill="#e5eef0" font-size="15"></text><rect x="35" y="220" width="240" height="38" rx="7" fill="#203240" stroke="#7795a6"/><text x="155.0" y="244" text-anchor="middle" fill="#e5eef0" font-size="17">Confirmed → canonical write</text><rect x="385" y="220" width="190" height="38" rx="7" fill="#203240" stroke="#7795a6"/><text x="480.0" y="244" text-anchor="middle" fill="#e5eef0" font-size="17">Discarded</text></svg>
